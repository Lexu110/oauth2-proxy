services:
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3
    container_name: oauth2-proxy
    restart: unless-stopped

    env_file:
      - .env

    environment:
      OAUTH2_PROXY_PROVIDER: oidc

      OAUTH2_PROXY_CLIENT_ID: ${DUO_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${DUO_CLIENT_SECRET}

      OAUTH2_PROXY_OIDC_ISSUER_URL: ${DUO_ISSUER_URL}
      OAUTH2_PROXY_OIDC_JWKS_URL: ${DUO_JWKS_URL}

      OAUTH2_PROXY_REDEEM_URL: ${DUO_REDEEM_URL}
      OAUTH2_PROXY_PROFILE_URL: ${DUO_PROFILE_URL}

      OAUTH2_PROXY_SKIP_OIDC_DISCOVERY: "true"

      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET}

      OAUTH2_PROXY_REDIRECT_URL: https://auth.lcorream.com/oauth2/callback

      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180

      OAUTH2_PROXY_REVERSE_PROXY: "true"

      OAUTH2_PROXY_SCOPE: "openid email profile"

      OAUTH2_PROXY_EMAIL_DOMAINS: "*"

      OAUTH2_PROXY_UPSTREAMS: static://202

      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"

    networks:
      - proxy

networks:
  proxy:
    external: true
    name: traefik_proxy